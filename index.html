const allVocab = rawVocab.filter((v, i, self) =>
    i === self.findIndex(x => x.ru === v.ru && x.lesson === v.lesson)
);

allVocab.forEach(v => {
    if (!lessonsMap[v.lesson]) lessonsMap[v.lesson] = [];
    lessonsMap[v.lesson].push(v);
});
const lessonNumbers = Object.keys(lessonsMap).map(Number).sort((a,b) => a-b);

// ============================================================
//  SPEAK RUSSIAN
// ============================================================
function speakRussian(text) {
    if (!text || !('speechSynthesis' in window)) return;
    // Clean up text: remove parenthetical hints, brackets, and latin letters
    let clean = text
        .replace(/\[[^\]]*\]/g, '')
        .replace(/\([^)]*\)/g, '')
        .replace(/[a-zA-Z«»"]/g, '')
        .replace(/[—–-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    if (!clean) clean = text;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'ru-RU';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
}

// ============================================================
//  VOCAB PICTURE (tap to hear)
// ============================================================
function renderVocabPicture(lesson) {
    const items = lessonsMap[lesson] || [];
    picLessonName.textContent = `Lesson ${lesson} (${items.length} words)`;
    vocabPicture.innerHTML = '';
    const limit = showAllVocab ? items.length : 24;
    items.slice(0, limit).forEach(item => {
        const div = document.createElement('div');
        div.className = 'vocab-item';
        div.dataset.ru = item.ru;
        div.innerHTML = `<span class="ru">${item.ru}</span><span class="en">${item.en}</span>`;
        div.addEventListener('click', () => playVocabItem(div, item.ru));
        vocabPicture.appendChild(div);
    });
    if (items.length > 24) {
        expandBtn.classList.remove('hidden');
        expandBtn.textContent = showAllVocab ? `Show less` : `Show all ${items.length}`;
    } else {
        expandBtn.classList.add('hidden');
    }
}

function playVocabItem(el, ruText) {
    // Highlight
    document.querySelectorAll('.vocab-item.playing').forEach(e => e.classList.remove('playing'));
    el.classList.add('playing');
    speakRussian(ruText);
    // Remove highlight after speech ends (approx 2s fallback)
    clearTimeout(el._hl);
    el._hl = setTimeout(() => el.classList.remove('playing'), 1500);
}

expandBtn.addEventListener('click', () => {
    showAllVocab = !showAllVocab;
    if (currentLesson) renderVocabPicture(currentLesson);
});

// ============================================================
//  LESSONS
// ============================================================
function renderLessons() {
    lessonGrid.innerHTML = '';
    lessonNumbers.forEach(num => {
        const count = (lessonsMap[num] || []).length;
        const btn = document.createElement('button');
        btn.className = 'lesson-btn';
        btn.textContent = `Lesson ${num} (${count})`;
        btn.dataset.lesson = num;
        btn.addEventListener('click', () => selectLesson(num));
        lessonGrid.appendChild(btn);
    });
    document.getElementById('lessonCount').textContent = `${lessonNumbers.length} lessons`;
}

function selectLesson(num) {
    currentLesson = num;
    showAllVocab = false;
    document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.querySelector(`.lesson-btn[data-lesson="${num}"]`);
    if (activeBtn) activeBtn.classList.add('active');

    picturePanel.classList.remove('hidden');
    renderVocabPicture(num);
    quizTypeSection.classList.remove('hidden');
    quizContainer.classList.add('hidden');

    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    currentQuizType = null;
    const count = (lessonsMap[num] || []).length;
    quizInfo.textContent = `This lesson has ${count} words. All will be used in the quiz.`;
    resetQuizState();
}

function resetQuizState() {
    if (advanceTimeout) clearTimeout(advanceTimeout);
    questionText.innerHTML = '';
    optionsContainer.innerHTML = '';
    inputContainer.classList.add('hidden');
    answerInput.value = '';
    answerInput.disabled = false;
    submitAnswerBtn.disabled = false;
    feedbackMessage.textContent = '';
    feedbackMessage.className = 'feedback';
    retryInfo.textContent = '';
    currentQuestions = [];
    originalQuestions = [];
    wrongQuestions = [];
    currentIndex = 0;
    answered = false;
    waitingRetry = false;
}

// ============================================================
//  QUIZ START
// ============================================================
function startQuiz(type) {
    if (!currentLesson) { alert('Please select a lesson first.'); return; }
    currentQuizType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    const typeBtn = document.querySelector(`.type-btn[data-type="${type}"]`);
    if (typeBtn) typeBtn.classList.add('active');

    const pool = lessonsMap[currentLesson] || [];
    if (pool.length === 0) { alert('No vocabulary for this lesson.'); return; }

    resetQuizState();

    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    originalQuestions = shuffled;
    currentQuestions = [...originalQuestions];
    wrongQuestions = [];
    currentIndex = 0;
    waitingRetry = false;

    quizContainer.classList.remove('hidden');
    renderQuestion();
}

// ============================================================
//  RENDER QUESTION
// ============================================================
function renderQuestion() {
    if (advanceTimeout) { clearTimeout(advanceTimeout); advanceTimeout = null; }

    if (currentIndex >= currentQuestions.length) {
        if (wrongQuestions.length > 0) {
            currentQuestions = [...wrongQuestions];
            wrongQuestions = [];
            currentIndex = 0;
            waitingRetry = true;
            renderQuestion();
            return;
        } else {
            questionText.innerHTML = '🎉 Quiz complete! All correct!';
            optionsContainer.innerHTML = '';
            inputContainer.classList.add('hidden');
            feedbackMessage.textContent = 'Excellent! You got everything right.';
            feedbackMessage.className = 'feedback correct';
            progressText.textContent = 'Done!';
            retryInfo.textContent = '';
            return;
        }
    }

    const q = currentQuestions[currentIndex];
    if (!q) { currentIndex++; renderQuestion(); return; }

    progressText.textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}` +
        (waitingRetry ? ' (retry round)' : '');
    retryInfo.textContent = wrongQuestions.length > 0 ? `⏳ ${wrongQuestions.length} to retry` : '';

    answered = false;
    feedbackMessage.textContent = '';
    feedbackMessage.className = 'feedback';
    optionsContainer.innerHTML = '';
    optionsContainer.style.display = 'grid';
    inputContainer.classList.add('hidden');
    answerInput.disabled = false;
    submitAnswerBtn.disabled = false;

    if (currentQuizType === 'ru-en') renderRuEn(q);
    else if (currentQuizType === 'en-ru') renderEnRu(q);
    else if (currentQuizType === 'write-ru') renderWriteRu(q);
}

function renderRuEn(q) {
    questionText.innerHTML = `<span>${q.ru}</span> <button class="speaker-btn" id="speakBtn" title="Listen">🔊</button>`;
    const sb = document.getElementById('speakBtn');
    if (sb) sb.addEventListener('click', (e) => { e.stopPropagation(); speakRussian(q.ru); });

    const pool = lessonsMap[currentLesson] || [];
    const distractors = pool.filter(v => v.en !== q.en).sort(() => Math.random() - 0.5).slice(0, 3);
    let options = [q, ...distractors];
    while (options.length < 4) options.push({ ru: '—', en: '—' });
    options = options.sort(() => Math.random() - 0.5);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.en;
        btn.dataset.correct = (opt.en === q.en) ? 'true' : 'false';
        btn.addEventListener('click', () => handleMCQ(btn, q, opt.en === q.en));
        optionsContainer.appendChild(btn);
    });
}

function renderEnRu(q) {
    questionText.innerHTML = `<span>${q.en}</span>`;
    const pool = lessonsMap[currentLesson] || [];
    const distractors = pool.filter(v => v.ru !== q.ru).sort(() => Math.random() - 0.5).slice(0, 3);
    let options = [q, ...distractors];
    while (options.length < 4) options.push({ ru: '—', en: '—' });
    options = options.sort(() => Math.random() - 0.5);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.ru;
        btn.dataset.correct = (opt.ru === q.ru) ? 'true' : 'false';
        btn.addEventListener('click', () => {
            if (!answered) speakRussian(opt.ru);
            handleMCQ(btn, q, opt.ru === q.ru);
        });
        optionsContainer.appendChild(btn);
    });
}

function renderWriteRu(q) {
    questionText.innerHTML = `<span>${q.en}</span>`;
    optionsContainer.innerHTML = '';
    optionsContainer.style.display = 'none';
    inputContainer.classList.remove('hidden');
    answerInput.value = '';
    answerInput.disabled = false;
    submitAnswerBtn.disabled = false;
    submitAnswerBtn.textContent = 'Check';
    answerInput.focus();
}

submitAnswerBtn.addEventListener('click', () => {
    if (currentQuizType !== 'write-ru') return;
    if (answered) return;
    if (currentIndex >= currentQuestions.length) return;
    const q = currentQuestions[currentIndex];
    if (!q) return;
    const userAnswer = answerInput.value.trim();
    const isCorrect = userAnswer.toLowerCase() === q.ru.toLowerCase();
    handleWrite(q, isCorrect);
});

answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && currentQuizType === 'write-ru' && !answered) {
        e.preventDefault();
        submitAnswerBtn.click();
    }
});

// ============================================================
//  HANDLERS
// ============================================================
function handleMCQ(btn, q, isCorrect) {
    if (answered) return;
    answered = true;
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        feedbackMessage.textContent = '✅ Correct!';
        feedbackMessage.className = 'feedback correct';
        advanceTimeout = setTimeout(() => { currentIndex++; renderQuestion(); }, 700);
    } else {
        btn.classList.add('wrong');
        document.querySelectorAll('.option-btn').forEach(b => {
            if (b.dataset.correct === 'true') b.classList.add('correct');
        });
        feedbackMessage.textContent = `❌ Incorrect. Right answer: ${currentQuizType === 'ru-en' ? q.en : q.ru}`;
        feedbackMessage.className = 'feedback wrong';
        if (!wrongQuestions.some(w => w.ru === q.ru && w.en === q.en)) wrongQuestions.push(q);
        speakRussian(q.ru);
        advanceTimeout = setTimeout(() => { currentIndex++; renderQuestion(); }, 1800);
    }
}

function handleWrite(q, isCorrect) {
    if (answered) return;
    answered = true;
    answerInput.disabled = true;
    submitAnswerBtn.disabled = true;

    if (isCorrect) {
        feedbackMessage.textContent = '✅ Correct!';
        feedbackMessage.className = 'feedback correct';
        advanceTimeout = setTimeout(() => { currentIndex++; renderQuestion(); }, 700);
    } else {
        feedbackMessage.textContent = `❌ Incorrect. Correct: ${q.ru}`;
        feedbackMessage.className = 'feedback wrong';
        if (!wrongQuestions.some(w => w.ru === q.ru && w.en === q.en)) wrongQuestions.push(q);
        speakRussian(q.ru);
        advanceTimeout = setTimeout(() => { currentIndex++; renderQuestion(); }, 2000);
    }
}

// ============================================================
//  LISTENERS
// ============================================================
document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', (e) => startQuiz(e.currentTarget.dataset.type));
});

restartQuizBtn.addEventListener('click', () => {
    if (currentLesson && currentQuizType) startQuiz(currentQuizType);
});

// ============================================================
//  INIT
// ============================================================
renderLessons();
</script>
</body>
</html>
